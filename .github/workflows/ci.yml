name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore LunarCal.slnx --locked-mode

      - name: Build
        run: dotnet build LunarCal.slnx --no-restore -c Release

      - name: Format check
        run: dotnet format LunarCal.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --solution LunarCal.slnx --no-build -c Release --coverage --coverage-output-format cobertura --results-directory TestResults

      # Phase 1 DoD: Lunar >= 95% lines; NFR-MAINT: Core >= 85% lines.
      - name: Coverage gate
        shell: pwsh
        run: ./eng/Test-Coverage.ps1 -Reports 'TestResults/*.cobertura.xml' -Gate 'src/LunarCal.Core/Lunar=95','src/LunarCal.Core=85'

      - name: Vulnerable packages
        shell: pwsh
        run: |
          $out = dotnet list LunarCal.slnx package --vulnerable --include-transitive 2>&1
          $out
          if ($out -match 'has the following vulnerable packages') { exit 1 }

      # CodeQL is added in P0-03 (SEC-SC-3).

  # Secret scanning with gitleaks (SEC-KEY-5, SEC-SC-3).
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Core is net10.0 and must stay OS-agnostic (ADR-0002). Build and test it in the
  # digest-pinned Linux SDK container from the Dockerfile (ADR-0023).
  core-linux-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test Core in Docker
        run: docker build --target test --progress plain -t lunarcal-core-test .
